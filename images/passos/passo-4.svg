<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" role="img" aria-label="CPF emitido e entregue em PDF">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <rect width="500" height="400" fill="url(#bg4)"/>
  <circle cx="440" cy="80" r="84" fill="#10B981" opacity="0.08"/>
  <circle cx="66" cy="330" r="74" fill="#F59E0B" opacity="0.08"/>

  <!-- Documento emitido -->
  <g transform="translate(140 52)">
    <rect x="10" y="14" width="220" height="286" rx="16" fill="#0B132B" opacity="0.08"/>
    <rect width="220" height="286" rx="16" fill="#FFFFFF"/>
    <rect x="0" y="0" width="220" height="58" rx="16" fill="#0B132B"/>
    <rect x="0" y="42" width="220" height="16" fill="#0B132B"/>
    <rect x="24" y="20" width="96" height="10" rx="5" fill="#F59E0B"/>
    <rect x="130" y="22" width="66" height="7" rx="3.5" fill="#FFFFFF" opacity="0.35"/>

    <!-- Número do documento -->
    <rect x="24" y="80" width="172" height="42" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="38" y="93" width="144" height="8" rx="4" fill="#0B132B" opacity="0.8"/>
    <rect x="38" y="107" width="90" height="6" rx="3" fill="#94A3B8"/>

    <g fill="#E2E8F0">
      <rect x="24" y="142" width="172" height="7" rx="3.5"/>
      <rect x="24" y="160" width="140" height="7" rx="3.5"/>
      <rect x="24" y="178" width="164" height="7" rx="3.5"/>
      <rect x="24" y="196" width="104" height="7" rx="3.5"/>
    </g>

    <!-- Assinatura -->
    <path d="M32 240c14-16 24 10 38-4s20 8 34-6 22 10 36-2" stroke="#0B132B" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>
    <rect x="32" y="256" width="110" height="5" rx="2.5" fill="#CBD5E1"/>

    <!-- Etiqueta PDF -->
    <g transform="translate(150 232)">
      <rect width="52" height="34" rx="8" fill="#10B981"/>
      <rect x="10" y="13" width="32" height="8" rx="4" fill="#FFFFFF" opacity="0.9"/>
    </g>
  </g>

  <!-- Selo aprovado -->
  <g transform="translate(300 236)">
    <circle cx="56" cy="56" r="56" fill="#10B981"/>
    <circle cx="56" cy="56" r="44" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.5"/>
    <path d="M36 57l14 14 30-30" stroke="#FFFFFF" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Selo dourado lateral -->
  <g transform="translate(44 120)">
    <circle cx="42" cy="42" r="42" fill="#F59E0B"/>
    <circle cx="42" cy="42" r="30" fill="none" stroke="#0B132B" stroke-width="3" opacity="0.35"/>
    <path d="M42 24l5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1z" fill="#0B132B" opacity="0.55"/>
    <path d="M28 82l14-10 14 10v26l-14-9-14 9z" fill="#F59E0B"/>
  </g>
</svg>
